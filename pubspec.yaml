name: bayanatz_task
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  data_connection_checker_tv: ^0.3.5-nullsafety
  dio: ^5.11.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.2
  flutter_localization: ^0.3.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  get_it: ^9.3.0
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.1.0
  modal_progress_hud_nsn: ^0.5.1
  path_provider: ^2.1.6
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5
  upgrader: ^13.7.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/gif/
    - assets/images/png/
    - assets/images/svg/
    - assets/images/anim/
    - assets/translations/ar.json
    - assets/translations/en.json

  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Black.ttf
        - asset: assets/fonts/Jost-Bold.ttf
        - asset: assets/fonts/Jost-ExtraBold.ttf
        - asset: assets/fonts/Jost-ExtraBold.ttf
        - asset: assets/fonts/Jost-Italic.ttf
        - asset: assets/fonts/Jost-Medium.ttf
        - asset: assets/fonts/Jost-Regular.ttf
        - asset: assets/fonts/Jost-SemiBold.ttf
        - asset: assets/fonts/Jost-Thin.ttf
          style: italic
    - family: Beiruti
      fonts:
        - asset: assets/fonts/Beiruti-Black.ttf
        - asset: assets/fonts/Beiruti-Bold.ttf
        - asset: assets/fonts/Beiruti-ExtraBold.ttf
        - asset: assets/fonts/Beiruti-ExtraLight.ttf
        - asset: assets/fonts/Beiruti-Light.ttf
        - asset: assets/fonts/Beiruti-Light.ttf
        - asset: assets/fonts/Beiruti-Regular.ttf
        - asset: assets/fonts/Beiruti-SemiBold.ttf

flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: app_assets.dart
  field_prefix: null
